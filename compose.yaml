
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 5s
      retries: 10


  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: localhost
    ports:
      - "5673:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: 'guest'
      RABBITMQ_DEFAULT_PASS: 'guest'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck: 
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      retries: 10
  
  redis:
    image: redis:7.0.15
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10     

  api:
    build: ./beckend
    command: granian --interface asgi app.main:app --host 0.0.0.0 --port 8001
    env_file: .env
    ports: 
      - "8001:8001"
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
  
  faststream-workers:
    build: ./beckend
    command: faststream run workers.main:app
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
     
  taskiq-sheduler:
    build: ./beckend
    command: taskiq scheduler workers.sheduler:schedule
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}


  faststream-service:
    build: ./code_sandbox
    env_file: .env
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}   


volumes:
  pgdata:
  rabbitmq-data:
  redis-data:

